<script>const alphabet="АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяӘҒҚҢӨҰҮҺІәғқңөұүһі";const groups={cyrl:alphabet,latin:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',digits:'0123456789.,:;!?«»“”()[]—–-ʼ‑₸₽₴№'};const el=id=>document.getElementById(id);for(const c of alphabet){const o=document.createElement('option');o.value=c;o.textContent=c;el('left').append(o)}function render(){const c=el('custom').value||el('left').value;const feat=['kern','ss01','ss07','ss08','ss09'].map(x=>"'"+x+"' "+(el(x).checked?1:0)).join(',');el('grid').replaceChildren();for(const r of groups[el('group').value]){const p=el('direction').value==='left'?c+r:r+c;const cell=document.createElement('div');cell.className='cell';for(const style of ['before','now']){const d=document.createElement('div');d.className=style;d.textContent=p;d.style.fontFeatureSettings=feat;cell.append(d)}el('grid').append(cell)}for(const id of ['sampleBefore','sampleNow']){el(id).textContent=el('sample').value;el(id).style.fontFeatureSettings=feat}}for(const n of document.querySelectorAll('select,input,textarea'))n.addEventListener('input',render);render();</script></html>
